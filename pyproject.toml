[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonl-resync"
version = "1.0.0"
description = "Locate the first corrupt JSONL line by byte offset and resync past it"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
jsonl-resync = "jsonl_resync.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["jsonl_resync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
